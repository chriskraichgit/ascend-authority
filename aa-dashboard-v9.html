<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101014" />
    <title>Ascend Authority Business Dashboard v9</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #8a5cf6;
        --accent-contrast: #fff;
        --accent-ink: #7043dc;
        --bg: #f4f4f2;
        --surface: #fff;
        --surface2: #f8f8f6;
        --text: #15151a;
        --muted: #74747f;
        --border: #e7e7e4;
        --success: #15803d;
        --success-surface: #dcfce7;
        --success-contrast: #fff;
        --danger: #b91c1c;
        --shadow: 0 18px 50px #14141c14;
        color-scheme: light;
      }
      html.dark {
        --bg: #101014;
        --surface: #18181e;
        --surface2: #202027;
        --text: #f6f6f4;
        --muted: #9b9ba5;
        --border: #2d2d35;
        --success: #4ade80;
        --success-surface: #163322;
        --success-contrast: #07140b;
        --danger: #f87171;
        --shadow: 0 18px 50px #00000047;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      .hidden {
        display: none !important;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .primary {
        min-height: 50px;
        border: 0;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 22px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
      }
      .primary:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }
      .primary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
      }
      .ghost {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 13px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .icon {
        font-size: 18px;
      }
      .small {
        font-size: 10px;
        color: var(--muted);
      }
      /* Onboarding */
      .onboarding {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 3px 1fr auto;
        background: transparent;
        color: var(--text);
      }
      .onboarding header {
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
        border-bottom: 1px solid var(--border);
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.15em;
      }
      .wordmark b {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 18px;
        font-style: italic;
      }
      .text-btn {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .on-progress {
        height: 3px;
        background: var(--border);
      }
      .on-progress span {
        display: block;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 15px color-mix(in srgb, var(--accent) 55%, transparent);
        transition: width 0.35s;
      }
      .on-card {
        width: min(650px, 90vw);
        align-self: center;
        justify-self: center;
        margin: 34px 0;
        padding: 52px clamp(24px, 5vw, 58px) 60px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .step-count {
        margin-bottom: 46px;
        color: var(--text);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0.08em;
      }
      .step-count span {
        color: var(--muted);
      }
      .on-card h1 {
        max-width: 630px;
        margin: 0;
        color: var(--text);
        font-size: clamp(38px, 5vw, 60px);
        line-height: 1.04;
        letter-spacing: -0.045em;
      }
      .on-copy {
        margin: 17px 0 32px;
        color: var(--muted);
        font-size: 17px;
      }
      .on-field input,
      .on-field textarea {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--border);
        outline: 0;
        resize: none;
        padding: 15px 0;
        background: transparent;
        color: var(--text);
        font-size: clamp(20px, 3vw, 28px);
      }
      .on-field input:focus,
      .on-field textarea:focus {
        border-color: var(--accent);
      }
      .on-field input::placeholder,
      .on-field textarea::placeholder {
        color: var(--muted);
        opacity: 0.75;
      }
      .money {
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .money span {
        color: var(--accent-ink);
        font-size: 28px;
      }
      .money input {
        border: 0;
      }
      .theme-chooser {
        display: grid;
        gap: 18px;
      }
      .color-field {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .color-field input[type="color"] {
        width: 64px;
        height: 64px;
        flex: 0 0 auto;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface2);
      }
      .color-field input[type="text"] {
        font-family: ui-monospace, monospace;
      }
      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .mode-switch button {
        min-height: 62px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface2);
        color: var(--muted);
        cursor: pointer;
      }
      .mode-switch button.active {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        color: var(--text);
      }
      .on-actions {
        margin-top: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .back {
        width: 50px;
        height: 50px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface2);
        color: var(--text);
        cursor: pointer;
      }
      .back:disabled {
        opacity: 0;
      }
      .onboarding footer {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
      }
      /* Loading */
      .loading,
      .celebration {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: center;
        color: var(--text);
        background: transparent;
      }
      .loader {
        width: 105px;
        height: 105px;
        position: relative;
        display: grid;
        place-items: center;
        margin-bottom: 34px;
      }
      .loader:before,
      .loader:after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
        border-radius: 50%;
        animation: spin 2s linear infinite;
      }
      .loader:after {
        inset: 12px;
        animation-direction: reverse;
        animation-duration: 1.4s;
      }
      .loader strong {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-contrast);
      }
      .loading h1 {
        margin: 0;
        max-width: 800px;
        color: var(--text);
        font-size: clamp(36px, 6vw, 66px);
        letter-spacing: -0.05em;
      }
      .loading p {
        color: var(--muted);
      }
      .loading > p:last-child {
        color: var(--muted);
      }
      /* Dashboard */
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr;
        background: transparent;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        width: 280px;
        display: flex;
        flex-direction: column;
        padding: 27px 20px;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .brand-mark {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 13px;
        font-weight: 900;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .brand-copy {
        min-width: 0;
        display: grid;
        gap: 2px;
      }
      .brand-copy strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .brand-copy span {
        color: var(--muted);
        font-size: 9px;
      }
      .sidebar nav {
        display: grid;
        gap: 6px;
        margin-top: 42px;
      }
      .sidebar nav button {
        min-height: 46px;
        display: flex;
        align-items: center;
        gap: 11px;
        border: 0;
        border-radius: 10px;
        padding: 0 12px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        cursor: pointer;
        text-align: left;
      }
      .sidebar nav button em {
        margin-left: auto;
        font-size: 10px;
        font-style: normal;
      }
      .sidebar nav button.active {
        background: color-mix(in srgb, var(--accent) 12%, var(--surface));
        color: var(--accent-ink);
      }
      .sidebar nav button.locked {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .spacer {
        flex: 1;
      }
      .upload {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px dashed var(--border);
        border-radius: 11px;
        padding: 12px;
        background: var(--surface2);
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }
      .upload span {
        display: grid;
      }
      .upload strong {
        color: var(--text);
        font-size: 11px;
      }
      .upload small {
        font-size: 9px;
      }
      .avatar {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--surface2);
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
      }
      .signed-user-avatar {
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
        background: var(--surface2);
      }
      .settings-btn {
        border: 1px solid var(--border);
        border-radius: 9px;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .main {
        grid-column: 2;
        min-width: 0;
      }
      .view {
        width: min(1160px, calc(100% - 72px));
        margin: auto;
        padding: 62px 0 70px;
      }
      .mobile-head,
      .scrim {
        display: none;
      }
      .page-footer {
        width: min(1160px, calc(100% - 72px));
        min-height: 68px;
        margin: auto;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
      }
      .page-footer button {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .view-hero,
      .maintain-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 45px;
        padding-bottom: 35px;
      }
      .view-hero h1,
      .maintain-hero h1 {
        max-width: 680px;
        margin: 0 0 14px;
        color: var(--text);
        font-size: clamp(36px, 5vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.05em;
      }
      .view-hero > div > p:last-child,
      .maintain-hero > div > p:last-child {
        max-width: 650px;
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }
      .hero-progress {
        flex: 0 0 290px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 17px;
        background: var(--surface);
        color: var(--text);
      }
      .ring {
        width: 70px;
        height: 70px;
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 50%;
        background: conic-gradient(
          var(--accent) calc(var(--value) * 1%),
          var(--border) 0
        );
      }
      .ring:before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: var(--surface);
      }
      .ring strong {
        position: relative;
        color: var(--text);
        font-size: 13px;
      }
      .hero-progress div:last-child {
        display: grid;
        gap: 5px;
      }
      .hero-progress strong {
        color: var(--text);
        font-size: 12px;
      }
      .hero-progress span {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }
      .progress-strip {
        height: 3px;
        margin-bottom: 50px;
        background: var(--border);
      }
      .progress-strip span {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.4s;
      }
      .check {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        margin-left: 22px;
        border: 1.5px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .growth-item.done .check {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-contrast);
      }
      .step-icon {
        width: 37px;
        height: 37px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 9%, var(--surface2));
        color: var(--accent-ink);
      }
      /* Panel */
      .panel-bg {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        justify-content: flex-end;
        background: #09090c99;
        backdrop-filter: blur(3px);
        animation: fade 0.2s;
      }
      .panel {
        width: min(540px, 100vw);
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
        color: var(--text);
        box-shadow: -24px 0 70px #0003;
        animation: slide 0.28s;
      }
      .panel > header {
        position: relative;
        padding: 42px 42px 30px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(
          155deg,
          color-mix(in srgb, var(--accent) 8%, var(--surface)),
          var(--surface) 55%
        );
        color: var(--text);
      }
      .close {
        position: absolute;
        right: 22px;
        top: 22px;
        width: 38px;
        height: 38px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .panel-icon {
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        margin-bottom: 25px;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 23px;
      }
      .panel h2 {
        max-width: 410px;
        margin: 0 0 10px;
        color: var(--text);
        font-size: 31px;
        line-height: 1.07;
        letter-spacing: -0.04em;
      }
      .panel > header > p:last-child {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 30px 42px;
        color: var(--text);
      }
      .panel-body h3 {
        margin: 0 0 22px;
        color: var(--text);
        font-size: 13px;
      }
      .panel-body ol {
        margin: 0;
        padding: 0;
        display: grid;
        gap: 20px;
        list-style: none;
      }
      .panel-body li {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 13px;
      }
      .panel-body li span {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 11%, var(--surface));
        color: var(--accent-ink);
        font-size: 10px;
        font-weight: 850;
      }
      .panel-body li p {
        margin: 2px 0 0;
        color: var(--text);
        font-size: 12px;
        line-height: 1.7;
      }
      .tip {
        margin-top: 28px;
        padding: 15px;
        border: 1px solid color-mix(in srgb, var(--accent) 23%, var(--border));
        border-radius: 11px;
        background: color-mix(in srgb, var(--accent) 6%, var(--surface));
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }
      .tip strong {
        display: block;
        color: var(--text);
        font-size: 11px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 25px;
      }
      .actions a {
        display: inline-flex;
        gap: 7px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        background: var(--surface);
        color: var(--text);
        font-size: 10px;
        font-weight: 750;
        text-decoration: none;
      }
      .bank-picker {
        margin-top: 26px;
      }
      .bank-picker label {
        display: block;
        margin-bottom: 9px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .bank-picker select {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 0 14px;
        background: var(--surface);
        color: var(--text);
      }
      .bank-result {
        display: none;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface2);
        color: var(--text);
      }
      .bank-result.show {
        display: flex;
      }
      .bank-result img {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        object-fit: contain;
        background: var(--surface);
      }
      .bank-result span {
        flex: 1;
        color: var(--text);
        font-size: 12px;
        font-weight: 750;
      }
      .bank-result a {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 12px;
        background: var(--surface);
        color: var(--text);
        font-size: 10px;
        font-weight: 750;
        text-decoration: none;
        white-space: nowrap;
      }
      .cal-help {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 14px;
        background: var(--surface);
        color: var(--muted);
        text-decoration: none;
      }
      .cal-help span {
        display: grid;
      }
      .cal-help strong {
        color: var(--text);
        font-size: 10px;
      }
      .cal-help small {
        font-size: 9px;
      }
      .panel > footer {
        padding: 18px 42px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .panel > footer button {
        width: 100%;
      }
      .panel > footer .complete {
        background: var(--success);
        color: var(--success-contrast);
      }
      /* Settings modal */
      .modal-bg {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #09090c99;
        backdrop-filter: blur(3px);
        animation: fade 0.2s;
      }
      .settings-modal {
        width: min(400px, 100%);
        border-radius: 18px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .settings-modal header {
        position: relative;
        padding: 24px 24px 16px;
        border-bottom: 1px solid var(--border);
      }
      .settings-modal h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .settings-modal header p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .settings-modal .close {
        top: 16px;
        right: 16px;
      }
      .settings-body {
        padding: 22px 24px;
        display: grid;
        gap: 20px;
      }
      .settings-row {
        display: grid;
        gap: 8px;
      }
      .settings-row label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .settings-row .color-field {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .settings-row .color-field input[type="color"] {
        width: 44px;
        height: 44px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .settings-row .color-field input[type="text"] {
        flex: 1;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--text);
        font-family: ui-monospace, monospace;
      }
      .settings-mode {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .settings-mode button {
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface2);
        color: var(--muted);
        cursor: pointer;
      }
      .settings-mode button.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .settings-modal footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
      }
      .settings-modal footer button {
        width: 100%;
      }
      /* Celebration & Maintain */
      .celebration {
        overflow: hidden;
        position: relative;
      }
      .trophy {
        width: 90px;
        height: 90px;
        display: grid;
        place-items: center;
        margin-bottom: 32px;
        border-radius: 26px;
        background: var(--accent);
        color: var(--accent-contrast);
        box-shadow: 0 25px 70px
          color-mix(in srgb, var(--accent) 45%, transparent);
        font-size: 42px;
        transform: rotate(-4deg);
      }
      .celebration h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(48px, 8vw, 88px);
        line-height: 0.95;
        letter-spacing: -0.065em;
      }
      .celebration > p:not(.eyebrow) {
        max-width: 690px;
        margin: 24px 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .celeb-stats {
        display: flex;
        gap: 12px;
        margin: 10px 0 34px;
        color: var(--muted);
      }
      .celeb-stats span {
        min-width: 145px;
        padding: 15px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--muted);
        font-size: 10px;
      }
      .celeb-stats strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
        font-size: 23px;
      }
      .confetti i {
        position: absolute;
        width: 9px;
        height: 18px;
        border-radius: 3px;
        background: var(--accent);
        animation: fall 3s infinite linear;
      }
      .confetti i:nth-child(1) {
        left: 10%;
        top: -5%;
      }
      .confetti i:nth-child(2) {
        left: 27%;
        top: -8%;
        animation-delay: 0.5s;
        background: #22c55e;
      }
      .confetti i:nth-child(3) {
        left: 44%;
        top: -10%;
        animation-delay: 1.3s;
        background: #f59e0b;
      }
      .confetti i:nth-child(4) {
        left: 65%;
        top: -5%;
        animation-delay: 0.9s;
      }
      .confetti i:nth-child(5) {
        left: 80%;
        top: -10%;
        animation-delay: 1.8s;
        background: #ec4899;
      }
      .confetti i:nth-child(6) {
        left: 92%;
        top: -8%;
        animation-delay: 2.2s;
        background: #38bdf8;
      }
      .maintain {
        display: grid;
        gap: 38px;
      }
      .maintain-hero {
        padding: 0;
      }
      .maintain-hero h1 {
        font-size: clamp(36px, 4vw, 51px);
      }
      .goal-card {
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 15px;
        background: var(--surface);
        color: var(--text);
      }
      .goal-card > span {
        flex: 1;
        display: grid;
      }
      .goal-card small,
      .summary small {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .goal-card button {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 9px;
      }
      .summary {
        display: grid;
        grid-template-columns: 220px 1fr auto;
        align-items: center;
        gap: 28px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        color: var(--text);
      }
      .summary-details {
        display: grid;
        grid-template-columns: 0.6fr 1.4fr;
        gap: 25px;
      }
      .summary-details span {
        min-width: 0;
        display: grid;
        gap: 6px;
      }
      .summary-details strong {
        overflow: hidden;
        color: var(--text);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .built {
        border-radius: 100px;
        padding: 8px 11px;
        background: var(--success-surface);
        color: var(--success);
        font-size: 9px;
        font-weight: 800;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        margin-bottom: 16px;
      }
      .heading h2 {
        margin: 0;
        color: var(--text);
        font-size: 22px;
      }
      .heading > span {
        color: var(--muted);
        font-size: 10px;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .metric {
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 15px;
        background: var(--surface);
        color: var(--text);
      }
      .metric-top {
        display: flex;
        justify-content: space-between;
      }
      .metric-icon {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 12%, var(--surface2));
        color: var(--accent-ink);
      }
      .metric-edit {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 9px;
        cursor: pointer;
        text-decoration: underline;
      }
      .metric p {
        margin: 20px 0 6px;
        color: var(--muted);
        font-size: 10px;
      }
      .metric > strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 28px;
      }
      .positive {
        color: var(--success);
        font-size: 9px;
        font-weight: 700;
      }
      .maintain-cols {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.75fr);
        gap: 16px;
      }
      .growth,
      .momentum {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        color: var(--text);
        padding: 22px;
      }
      .growth-list {
        border-top: 1px solid var(--border);
      }
      .growth-item {
        width: 100%;
        min-height: 70px;
        display: grid;
        grid-template-columns: 24px 37px 1fr auto;
        align-items: center;
        gap: 12px;
        border: 0;
        border-bottom: 1px solid var(--border);
        padding: 11px 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }
      .growth-item .check {
        margin: 0;
      }
      .growth-item > span:nth-child(3) {
        display: grid;
        gap: 4px;
      }
      .growth-item strong {
        color: var(--text);
        font-size: 11px;
      }
      .growth-item small {
        color: var(--muted);
        font-size: 9px;
      }
      .growth-item.done strong {
        text-decoration: line-through;
        color: var(--muted);
      }
      .growth-item .remove {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        padding: 6px;
      }
      .reset-note {
        color: var(--muted);
        font-size: 8px;
      }
      .add-task {
        width: 100%;
        min-height: 48px;
        margin-top: 12px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .streak {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .streak b {
        font-size: 34px;
      }
      .streak span {
        display: grid;
      }
      .streak small {
        color: var(--muted);
      }
      .bars {
        height: 125px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin: 30px 0 8px;
      }
      .bars span {
        flex: 1;
        border-radius: 5px 5px 2px 2px;
        background: color-mix(in srgb, var(--accent) 22%, var(--surface2));
      }
      .bars span:last-child {
        background: var(--accent);
      }
      .bar-labels {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 7px;
      }
      .score {
        color: var(--text);
        font-size: 25px;
      }
      .quick-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .quick-grid > * {
        min-height: 190px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 22px;
        background: var(--surface);
        color: var(--text);
        text-align: left;
        text-decoration: none;
        cursor: pointer;
      }
      .quick-grid .qicon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        margin-bottom: 22px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 10%, var(--surface2));
        color: var(--accent-ink);
      }
      .quick-grid strong {
        margin-bottom: 8px;
        color: var(--text);
        font-size: 13px;
      }
      .quick-grid small {
        color: var(--muted);
        font-size: 9px;
        line-height: 1.55;
      }
      .quick-grid em {
        margin-top: auto;
        color: var(--accent-ink);
        font-size: 9px;
        font-style: normal;
        font-weight: 800;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      @keyframes slide {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(380deg);
        }
      }
      @media (max-width: 900px) {
        .shell {
          display: block;
          padding-top: 68px;
        }
        .mobile-head {
          position: fixed;
          inset: 0 0 auto;
          z-index: 35;
          height: 68px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 18px;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
        }
        .mobile-head button {
          border: 0;
          background: none;
          font-size: 24px;
        }
        .mobile-head .brand-mark {
          width: 38px;
          height: 38px;
        }
        .sidebar {
          width: min(300px, 86vw);
          transform: translateX(-100%);
          transition: transform 0.25s;
        }
        .menu-open .sidebar {
          transform: none;
        }
        .scrim {
          position: fixed;
          inset: 0;
          z-index: 19;
          display: block;
          border: 0;
          background: #0008;
        }
        .main {
          width: 100%;
        }
        .view {
          width: min(100% - 36px, 760px);
          padding-top: 38px;
        }
        .view-hero,
        .maintain-hero {
          align-items: stretch;
          flex-direction: column;
        }
        .hero-progress {
          flex-basis: auto;
          width: 100%;
        }
        .summary {
          grid-template-columns: 1fr;
        }
        .summary-details {
          grid-template-columns: 1fr 1fr;
        }
        .maintain-cols {
          grid-template-columns: 1fr;
        }
        .metric-grid,
        .quick-grid {
          grid-template-columns: 1fr 1fr;
        }
        .page-footer {
          width: calc(100% - 36px);
        }
      }
      @media (max-width: 600px) {
        .onboarding header {
          height: 70px;
          padding: 0 20px;
        }
        .onboarding header .text-btn {
          display: none;
        }
        .on-card {
          width: calc(100vw - 28px);
          margin: 20px 0;
          padding: 36px 22px 44px;
          border-radius: 18px;
        }
        .step-count {
          margin-bottom: 34px;
        }
        .on-card h1 {
          font-size: 39px;
        }
        .on-copy {
          font-size: 14px;
        }
        .onboarding footer {
          justify-content: center;
        }
        .onboarding footer span:last-child {
          display: none;
        }
        .view-hero h1,
        .maintain-hero h1 {
          font-size: 38px;
        }
        .check {
          margin-left: 14px;
        }
        .step-icon {
          width: 34px;
          height: 34px;
        }
        .panel {
          width: 100vw;
        }
        .panel > header {
          padding: 32px 24px 24px;
        }
        .panel h2 {
          padding-right: 25px;
          font-size: 28px;
        }
        .panel-body {
          padding: 25px 24px;
        }
        .panel > footer {
          padding: 15px 24px;
        }
        .close {
          top: 16px;
          right: 16px;
        }
        .celeb-stats {
          width: 100%;
          flex-direction: column;
        }
        .celebration .primary {
          width: 100%;
        }
        .goal-card {
          min-width: 0;
          width: 100%;
        }
        .summary-details {
          grid-template-columns: 1fr;
        }
        .metric-grid,
        .quick-grid {
          grid-template-columns: 1fr;
        }
        .maintain-cols {
          gap: 14px;
        }
        .quick-grid > * {
          min-height: 170px;
        }
      }

      /* v8: single-task build flow and organized Growth Home */
      .focus-build-view {
        display: grid;
        gap: 26px;
      }
      .focus-build-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
      }
      .focus-build-head h1 {
        margin: 0 0 10px;
        color: var(--text);
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.03;
        letter-spacing: -0.05em;
      }
      .focus-build-head p:last-child {
        max-width: 620px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }
      .focus-progress-copy {
        flex: 0 0 auto;
        display: grid;
        gap: 5px;
        text-align: right;
      }
      .focus-progress-copy strong {
        color: var(--text);
        font-size: 13px;
      }
      .focus-progress-copy span {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .focus-task-card {
        width: min(820px, 100%);
        margin: 10px auto 0;
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: clamp(26px, 5vw, 48px);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .focus-task-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }
      .focus-task-meta .chapter-label {
        background: var(--surface2);
        color: var(--muted);
      }
      .focus-task-meta small {
        color: var(--muted);
        font-size: 9px;
      }
      .focus-task-card h2 {
        margin: 0 0 12px;
        color: var(--text);
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }
      .focus-task-card > .roadmap-step-description {
        margin-bottom: 36px;
        font-size: 14px;
      }
      .task-action-plan {
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--surface2) 72%, var(--surface));
      }
      .task-action-plan h4 {
        margin: 0 0 18px;
        color: var(--text);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-transform: none;
      }
      .task-action-plan .roadmap-instructions {
        gap: 12px;
      }
      .task-action-plan .roadmap-instructions li {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 15px;
        min-height: 64px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid color-mix(in srgb, var(--border) 76%, transparent);
        border-radius: 12px;
        background: var(--surface);
      }
      .task-action-plan .roadmap-instructions li > span {
        width: 34px;
        height: 34px;
        background: color-mix(in srgb, var(--accent) 14%, var(--surface2));
        font-size: 11px;
      }
      .task-action-plan .roadmap-instructions p {
        margin: 0;
        font-size: 13px;
        line-height: 1.65;
      }
      .focus-task-card .chapter-complete-step {
        margin-top: 28px;
      }
      .optional-skip {
        width: 100%;
        min-height: 44px;
        margin-top: 10px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        cursor: pointer;
      }
      .optional-skip:hover {
        color: var(--text);
      }
      .chapter-review {
        width: min(820px, 100%);
        margin: 0 auto;
      }
      .chapter-review > p {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .chapter-review details {
        border-top: 1px solid var(--border);
      }
      .chapter-review details:last-child {
        border-bottom: 1px solid var(--border);
      }
      .chapter-review summary {
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        cursor: pointer;
        list-style: none;
      }
      .chapter-review summary::-webkit-details-marker {
        display: none;
      }
      .chapter-review summary .ui-icon {
        width: 15px;
        height: 15px;
        color: var(--success);
      }
      .chapter-review summary strong {
        flex: 1;
        font-size: 10px;
      }
      .chapter-review summary span:last-child {
        color: var(--muted);
        font-size: 8px;
      }
      .chapter-review-body {
        padding: 0 0 22px 25px;
      }
      .chapter-review-body .roadmap-step-description {
        margin-top: 0;
      }
      .finished-chapters {
        width: min(820px, 100%);
        margin: 2px auto 0;
      }
      .finished-chapters > header {
        margin-bottom: 12px;
      }
      .finished-chapters > header h2 {
        margin: 0 0 6px;
        color: var(--text);
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .finished-chapters > header p {
        margin: 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }
      .finished-chapter {
        overflow: hidden;
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
      }
      .finished-chapter > summary {
        min-height: 62px;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto 16px;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        color: var(--text);
        cursor: pointer;
        list-style: none;
      }
      .finished-chapter > summary::-webkit-details-marker {
        display: none;
      }
      .finished-chapter-check {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--success-surface);
        color: var(--success);
      }
      .finished-chapter-check .ui-icon {
        width: 16px;
        height: 16px;
      }
      .finished-chapter-title {
        min-width: 0;
        display: grid;
        gap: 3px;
      }
      .finished-chapter-title strong {
        overflow: hidden;
        color: var(--text);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .finished-chapter-title small,
      .finished-chapter-count {
        color: var(--muted);
        font-size: 8px;
      }
      .finished-chapter-chevron {
        width: 16px;
        height: 16px;
        color: var(--muted);
        transition: transform 0.2s ease;
      }
      .finished-chapter[open] .finished-chapter-chevron {
        transform: rotate(180deg);
      }
      .finished-chapter-body {
        display: grid;
        gap: 8px;
        padding: 0 16px 16px 60px;
      }
      .finished-step-review {
        width: 100%;
        min-height: 46px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--surface2);
        color: var(--text);
        text-align: left;

          const params = new URLSearchParams(window.location.search),

            body: JSON.stringify({

              redirect_uri: WHOP_REDIRECT_URI,
              client_id: WHOP_CLIENT_ID,

        function parseHexColor(value) {
          const match = String(value || "")

            .match(/^#([0-9a-f]{6})$/i);
          if (!match) return [138, 92, 246];
          return [0, 2, 4].map((index) =>
            parseInt(match[1].slice(index, index + 2), 16),
          );

        function colorLuminance(rgb) {
          const linear = rgb.map((value) => {
            const channel = value / 255;
            return channel <= 0.04045
              ? channel / 12.92
              : Math.pow((channel + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
        }
        function contrastRatio(first, second) {
          const a = colorLuminance(first),
            b = colorLuminance(second);
          return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);

        function mixRgb(from, to, amount) {
          return from.map((value, index) =>
            Math.round(value + (to[index] - value) * amount),
          );

          return (
            "#" +
            rgb.map((value) => value.toString(16).padStart(2, "0")).join("")

        }

          if (contrastRatio(accent, surface) >= 4.5) return accent;
          const target =
            colorLuminance(surface) > 0.5 ? [0, 0, 0] : [255, 255, 255];
          for (let amount = 0.05; amount <= 1; amount += 0.05) {
            const candidate = mixRgb(accent, target, amount);
            if (contrastRatio(candidate, surface) >= 4.5) return candidate;
          }
          return target;
        }

            "--accent-contrast",

            return {
              source: "Your logged numbers",

          const adding = monthlyGoalsModalMode === "add",
            today = new Date().toISOString().slice(0, 10);
          return `<div class="modal-bg monthly-goals-modal-bg" id="monthly-goals-bg"><section class="monthly-goals-modal" role="dialog" aria-modal="true" aria-labelledby="monthly-goals-modal-title"><button class="close" id="monthly-goals-close" type="button" aria-label="Close">${icon("x")}</button><p class="eyebrow">${esc(currentMonthLabel())}</p><h2 id="monthly-goals-modal-title">${adding ? "Add a task" : `Set your goals for ${esc(new Date().toLocaleDateString("en-US", { month: "long" }))}`}</h2><p>${adding ? "Add one specific task or outcome to this month." : "Enter one goal or task per line. Nothing is pre-filled—you decide what matters this month."}</p><label class="monthly-goals-task-field"><span>${adding ? "Task" : "Tasks"}</span><textarea id="monthly-goals-input" rows="${adding ? 3 : 7}" placeholder="${adding ? "Example: Follow up with every open estimate" : "One goal per line"}"></textarea></label><label class="monthly-goals-repeat-setting"><span>Task type</span><select id="monthly-goals-repeat"><option value="one-time">One time</option><option value="repeating">Repeating monthly</option></select></label><label class="monthly-goals-start-date" id="monthly-goals-start-date-field" hidden>First due date (month / day / year)<input id="monthly-goals-start-date" type="date" value="${today}"></label><div class="monthly-goals-modal-actions"><button class="ghost" id="monthly-goals-cancel" type="button">Not now</button><button class="primary" id="monthly-goals-save" type="button">${adding ? "Add task" : "Save goals"}</button></div></section></div>`;
        }
        function maintainMarkup() {
          const firstName = (authUser?.name || "there").split(" ")[0];
          const today = new Date().toISOString().slice(0, 10);
          const suggestion = smartSuggestion();
          const goals = currentMonthGoals();
          if (!goals.length && monthlyGoalsPromptedFor !== monthKey()) {
            monthlyGoalsPromptedFor = monthKey();
            monthlyGoalsModalMode = "set";
            monthlyGoalsModalOpen = true;
          }
          return `<div class="view maintain growth-home">
            <section class="maintain-hero"><div><p class="eyebrow">Growth Home</p><h1>Good afternoon, ${esc(firstName)}.</h1><p>Use your own numbers to see what is moving ${esc(state.profile.businessName)} forward.</p></div><div class="goal-card"><span class="icon">${icon("target")}</span><span><small>Monthly goal</small><strong>${esc(state.profile.revenueGoal)}</strong></span><button id="edit-goal">${icon("pencil")} Edit</button></div></section>
            <section class="smart-suggestion"><span>${icon("sparkles")}</span><div><p class="eyebrow">Built from your account</p><h2>Next best move</h2><p>${suggestion.text}</p><small class="suggestion-source">${suggestion.source}</small></div></section>
            ${monthlyGoalsMarkup()}
            <section class="growth-cluster" aria-labelledby="performance-title">
              <header class="growth-cluster-head"><div><p class="eyebrow">Performance</p><h2 id="performance-title">Log, review, adjust</h2></div><p>Your business log powers the revenue trend and account-based suggestion.</p></header>
              <aside class="local-data-note">${icon("shield")} <span><strong>Saved on this browser only.</strong> Until account sync launches, these entries do not move to another device and are not visible in CAL Marketing admin tools.</span></aside>
              <section class="logging-section"><div class="heading"><div><p class="eyebrow">Your real numbers</p><h2>Log a business period</h2></div><span>Enter weekly or monthly—use the cadence you actually review.</span></div>
                <form class="data-form" id="business-log-form">
                  <label>Period ending<input name="date" type="date" value="${today}" required></label>
                  <label>Cadence<select name="cadence"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label>
                  <label>Revenue<input name="revenue" type="number" min="0" step="0.01" placeholder="0" required></label>
                  <label>Leads received<input name="leads" type="number" min="0" step="1" placeholder="0" required></label>
                  <label>Sales closed<input name="sales" type="number" min="0" step="1" placeholder="0" required></label>
                  <label>Calls / outreach<input name="outreach" type="number" min="0" step="1" placeholder="0" required></label>
                  <label>Reviews collected<input name="reviews" type="number" min="0" step="1" placeholder="0" required></label>
                  <button class="primary" type="submit"><span>Save period</span>${icon("arrow-right")}</button>
                </form>
              </section>
              <div class="growth-data-grid">
                <section class="trend-card"><div class="heading"><div><p class="eyebrow">Over time</p><h2>Your revenue trend</h2></div><span>Built only from your entries.</span></div>${trendMarkup()}${logHistoryMarkup()}</section>
              </div>
            </section>
            <section class="quick-actions-section" aria-labelledby="quick-actions-title">
              <header class="section-intro"><div><p class="eyebrow">Keep improving</p><h2 id="quick-actions-title">Quick actions</h2></div><p>Jump back into the areas that are worth reviewing as your business grows.</p></header>
              <div class="quick-actions-card"><div class="quick-grid">
                <a href="https://cal.marketing/qualify" target="_blank" rel="noreferrer"><span class="quick-action-image-wrap"><img class="quick-cal-logo cal-logo-light" src="https://assets.cdn.filesafe.space/CWA7ybFILove8e29NqFc/media/6a68fd83352088803404d4d8.png" alt="CAL Marketing"><img class="quick-cal-logo cal-logo-dark" src="https://assets.cdn.filesafe.space/CWA7ybFILove8e29NqFc/media/6a68fd578219a56ed3440c3c.png" alt="CAL Marketing"></span><strong>Need help with marketing?</strong><small>Talk through your next growth move with CAL Marketing.</small><em>Get support</em></a>
                <a href="mailto:support@ascendauthority.com"><span class="quick-action-image-wrap"><img class="quick-action-image support-image" src="https://assets.cdn.filesafe.space/7dAut74WhZI0BfZoNUu2/media/6a720496ee7ca3d1c47454df.png" alt="Ascend Authority support"></span><strong>Contact Support</strong><small>Have an issue? Email our support team.</small><span class="quick-action-email">support@ascendauthority.com</span><em>Email support</em></a>
              </div></div>
            </section>
          </div>${monthlyGoalsModalMarkup()}`;
        }
        function bindMaintain() {
          const openMonthlyGoals = (mode) => {
            monthlyGoalsModalMode = mode;
            monthlyGoalsModalOpen = true;
            render();
          };
          document.querySelectorAll("[data-monthly-goal]").forEach((button) => {
            button.onclick = () => {
              const key = monthKey();
              state.monthlyGoals[key] = currentMonthGoals().map((goal) =>
                goal.id === button.dataset.monthlyGoal
                  ? { ...goal, done: !goal.done }
                  : goal,
              );
              render();
            };
          });
          document
            .querySelectorAll("[data-recurring-monthly-goal]")
            .forEach((button) => {
              button.onclick = () => {
                const key = monthKey(),
                  goal = currentMonthGoals().find(
                    (item) => item.id === button.dataset.recurringMonthlyGoal,
                  );
                if (!goal) return;
                const recurrenceId =
                  goal.recurrenceId || `repeat-${Date.now()}`;
                if (goal.recurring) {
                  state.recurringMonthlyGoals = (
                    state.recurringMonthlyGoals || []
                  ).filter((item) => item.id !== recurrenceId);
                  state.monthlyGoals[key] = currentMonthGoals().map((item) =>
                    item.id === goal.id
                      ? {
                          ...item,
                          recurring: false,
                          recurrenceId: undefined,
                          recurringStartDate: undefined,
                          dueDate: undefined,
                        }
                      : item,
                  );
                } else {
                  const startDate = new Date().toISOString().slice(0, 10);
                  state.recurringMonthlyGoals = [
                    ...(state.recurringMonthlyGoals || []),
                    {
                      id: recurrenceId,
                      title: goal.title,
                      createdAt: new Date().toISOString(),
                      startDate,
                    },
                  ];
                  state.monthlyGoals[key] = currentMonthGoals().map((item) =>
                    item.id === goal.id
                      ? {
                          ...item,
                          recurring: true,
                          recurrenceId,
                          recurringStartDate: startDate,
                          dueDate: startDate,
                        }
                      : item,
                  );
                }
                render();
              };
            });
          document
            .querySelectorAll("[data-recurring-start-date]")
            .forEach((input) => {
              input.onchange = () => {
                if (!input.value) return;
                const key = monthKey(),
                  goal = currentMonthGoals().find(
                    (item) => item.id === input.dataset.recurringStartDate,
                  );
                if (!goal?.recurrenceId) return;
                state.recurringMonthlyGoals = (
                  state.recurringMonthlyGoals || []
                ).map((template) =>
                  template.id === goal.recurrenceId
                    ? { ...template, startDate: input.value }
                    : template,
                );
                state.monthlyGoals[key] = currentMonthGoals().map((item) =>
                  item.id === goal.id
                    ? {
                        ...item,
                        recurringStartDate: input.value,
                        dueDate: input.value,
                      }
                    : item,
                );
                render();
              };
            });
          document
            .querySelectorAll("[data-remove-monthly-goal]")
            .forEach((button) => {
              button.onclick = () => {
                const key = monthKey();
                const removed = currentMonthGoals().find(
                  (goal) => goal.id === button.dataset.removeMonthlyGoal,
                );
                if (removed?.recurring && removed.recurrenceId) {
                  state.recurringMonthlyGoals = (
                    state.recurringMonthlyGoals || []
                  ).filter((item) => item.id !== removed.recurrenceId);
                }
                state.monthlyGoals[key] = currentMonthGoals().filter(
                  (goal) => goal.id !== button.dataset.removeMonthlyGoal,
                );
                if (!state.monthlyGoals[key].length) {
                  monthlyGoalsModalMode = "set";
                  monthlyGoalsModalOpen = true;
                }
                render();
              };
            });
          const setGoals = $("#set-monthly-goals"),
            addGoal = $("#add-monthly-goal");
          if (setGoals) setGoals.onclick = () => openMonthlyGoals("set");
          if (addGoal) addGoal.onclick = () => openMonthlyGoals("add");
          const closeMonthlyGoals = () => {
            monthlyGoalsModalOpen = false;
            render();
          };
          const goalsClose = $("#monthly-goals-close"),
            goalsCancel = $("#monthly-goals-cancel"),
            goalsBg = $("#monthly-goals-bg"),
            goalsSave = $("#monthly-goals-save");
          if (goalsClose) goalsClose.onclick = closeMonthlyGoals;
          if (goalsCancel) goalsCancel.onclick = closeMonthlyGoals;
          if (goalsBg)
            goalsBg.onclick = (event) => {
              if (event.target === goalsBg) closeMonthlyGoals();
            };
          const repeatType = $("#monthly-goals-repeat"),
            repeatDateField = $("#monthly-goals-start-date-field");
          if (repeatType && repeatDateField)
            repeatType.onchange = () => {
              repeatDateField.hidden = repeatType.value !== "repeating";
            };
          if (goalsSave)
            goalsSave.onclick = () => {
              if (goalsSave.dataset.saving === "true") return;
              const entries = $("#monthly-goals-input")
                .value.split(/\n+/)
                .map((value) => value.trim())
                .filter(Boolean);
              if (!entries.length) return;
              const key = monthKey(),
                existingGoals =
                  monthlyGoalsModalMode === "add"
                    ? [...currentMonthGoals()]
                    : [],
                repeatMonthly = $("#monthly-goals-repeat")?.value === "repeating",
                recurringStartDate =
                  $("#monthly-goals-start-date")?.value ||
                  new Date().toISOString().slice(0, 10),
                createdAt = new Date().toISOString(),
                goalBatchId = Date.now(),
                newGoals = entries.map((title, index) => {
                  const recurrenceId = repeatMonthly
                    ? `repeat-${goalBatchId}-${index}`
                    : undefined;
                  if (repeatMonthly)
                    state.recurringMonthlyGoals = [
                      ...(state.recurringMonthlyGoals || []),
                      {
                        id: recurrenceId,
                        title,
                        createdAt,
                        startDate: recurringStartDate,
                      },
                    ];
                  return {
                    id: `goal-${goalBatchId}-${index}`,
                    title,
                    done: false,
                    recurring: repeatMonthly,
                    recurrenceId,
                    recurringStartDate: repeatMonthly
                      ? recurringStartDate
                      : undefined,
                    dueDate: repeatMonthly ? recurringStartDate : undefined,
                    createdAt,
                  };
                });
              goalsSave.dataset.saving = "true";
              goalsSave.disabled = true;
              state.monthlyGoals[key] = dedupeMonthlyGoals([
                ...existingGoals,
                ...newGoals,
              ]);
              monthlyGoalsModalOpen = false;
              render();
            };
          document
            .querySelectorAll(".quick-grid [data-review-step]")
            .forEach((button) => {
              button.onclick = () => openStepReview(button.dataset.reviewStep);
            });
          const logForm = $("#business-log-form");
          if (logForm)
            logForm.onsubmit = (event) => {
              event.preventDefault();
              const values = Object.fromEntries(new FormData(logForm));
              state.businessLogs = [
                ...(state.businessLogs || []),
                { id: `log-${Date.now()}`, ...values },
              ];
              render();
            };
          document.querySelectorAll("[data-delete-log]").forEach((button) => {
            button.onclick = () => {
              state.businessLogs = (state.businessLogs || []).filter(
                (item) => item.id !== button.dataset.deleteLog,
              );
              render();
            };
          });
          $("#edit-goal").onclick = () => {
            const value = prompt(
              "Enter your monthly revenue goal:",
              state.profile.revenueGoal,
            );
            if (value) {
              state.profile.revenueGoal = value;
              render();
            }
          };
        }
        window.refreshTokens = refreshTokens;
        window.logout = logout;
        initializeWhopAuth();
      })();
    </script>
  </body>
</html>
